[build]
  command = "npm run build"
  publish = "dist"

# Redirecionamento amigável para a área administrativa
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Redirecionamentos para Netlify Identity e OAuth se necessário
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
